name: "iOS Build"

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS
        run: |
          xcodebuild \
            -project KAPCHURA.xcodeproj \
            -scheme KAPCHURA \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Debug-iphoneos/KAPCHURA.app"
          test -d "$APP_PATH"
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/KAPCHURA.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent ipa/Payload KAPCHURA-unsigned.ipa
          unzip -l KAPCHURA-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: KAPCHURA-unsigned-IPA
          path: KAPCHURA-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
