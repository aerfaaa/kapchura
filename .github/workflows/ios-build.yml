name: "iOS Build"

on:
  push:
    branches:
      - main
      - feature/logcam-pipeline-foundation
  pull_request:
    branches:
      - main
      - rebuild/kapchura-native-camera
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project KAPCHURA.xcodeproj \
            -scheme KAPCHURA \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Debug-iphoneos/KAPCHURA.app ipa/Payload/KAPCHURA.app
          cd ipa
          /usr/bin/zip -qry ../KAPCHURA-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: KAPCHURA-unsigned-IPA
          path: KAPCHURA-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
