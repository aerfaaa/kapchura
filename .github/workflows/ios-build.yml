```yaml
name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS
        run: |
          xcodebuild \
            -project KAPCHURA.xcodeproj \
            -scheme KAPCHURA \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload unsigned app bundle
        uses: actions/upload-artifact@v4
        with:
          name: KAPCHURA-unsigned-app
          path: build/Build/Products/Debug-iphoneos/KAPCHURA.app
          if-no-files-found: error
          retention-days: 7
```
