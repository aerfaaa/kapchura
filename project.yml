name: KAPCHURA
options:
  bundleIdPrefix: com.aerfaaa
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
targets:
  KAPCHURA:
    type: application
    platform: iOS
    sources:
      - path: Sources/KAPCHURA
    info:
      path: Sources/KAPCHURA/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aerfaaa.kapchura
        PRODUCT_NAME: KAPCHURA
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KAPCHURA
        INFOPLIST_KEY_NSCameraUsageDescription: "KAPCHURA needs camera access to capture photos and video."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "KAPCHURA uses the microphone to record audio with video."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "KAPCHURA can save captured media to your photo library."
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
